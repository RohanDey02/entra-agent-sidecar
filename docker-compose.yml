# Local proof of the two-container layout.
# Compose gives each service its own network namespace, so the app reaches the
# sidecar at http://sidecar:5000. On GKE the containers share a pod network
# and the app uses http://127.0.0.1:5000. The sidecar port is not published.

services:
  sidecar:
    image: mcr.microsoft.com/entra-sdk/auth-sidecar:1.0.0
    environment:
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${TENANT_ID:?Set TENANT_ID in .env}
      AzureAd__ClientId: ${BLUEPRINT_APP_ID:?Set BLUEPRINT_APP_ID in .env}
      AzureAd__Audience: ${AZURE_AD_AUDIENCE:?Set AZURE_AD_AUDIENCE to the blueprint app ID}
      AzureAd__Scopes: ${INBOUND_SCOPE:-access_as_user}
      AzureAd__ClientCredentials__0__SourceType: ClientSecret
      AzureAd__ClientCredentials__0__ClientSecret: ${BLUEPRINT_CLIENT_SECRET:?Set BLUEPRINT_CLIENT_SECRET in .env}
      DownstreamApis__Gateway__BaseUrl: ${GATEWAY_BASE_URL:?Set GATEWAY_BASE_URL in .env}
      DownstreamApis__Gateway__Scopes__0: ${GATEWAY_SCOPE:?Set GATEWAY_SCOPE in .env}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
    restart: unless-stopped

  agent:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SIDECAR_URL: http://sidecar:5000
      BLUEPRINT_APP_ID: ${BLUEPRINT_APP_ID:?Set BLUEPRINT_APP_ID in .env}
      ACP_GATEWAY_APP_ID: ${ACP_GATEWAY_APP_ID:?Set ACP_GATEWAY_APP_ID in .env}
      AGENT_CLIENT_ID: ${AGENT_CLIENT_ID:?Set AGENT_CLIENT_ID in .env}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:?Set GATEWAY_BASE_URL in .env}
      GATEWAY_AUDIENCE: ${GATEWAY_AUDIENCE:?Set GATEWAY_AUDIENCE in .env}
      GATEWAY_PATH: ${GATEWAY_PATH:-/}
    depends_on:
      - sidecar
    restart: unless-stopped
